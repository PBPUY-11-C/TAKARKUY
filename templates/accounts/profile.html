{% extends "accounts/settings_base.html" %}
{% block title %}Akun - Pengaturan profil{% endblock %}
{% block settings_content %}
<h2 id="settings-panel-title">Akun</h2>
<p class="settings-description">Perbarui nama, username, dan alamat email akunmu.</p>
<form method="post" class="account-settings-form">
  {% csrf_token %}<input type="hidden" name="action" value="account">
  {{ account_form.as_div }}
  <div class="settings-actions"><button class="submit" type="submit">Simpan informasi akun</button></div>
</form>
{% endblock %}
