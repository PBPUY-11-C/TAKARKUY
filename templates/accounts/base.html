<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Akun{% endblock %} — TAKARKUY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #172235; --muted: #56646b; --green: #007452; --line: #d8e2f3; --canvas: #f7f9fe; --field: #eef2ff; }
    *, *::before, *::after { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 28px 16px; background: var(--canvas); color: var(--ink); font-family: "DM Sans", Arial, sans-serif; }
    a { color: var(--green); text-decoration: none; font-weight: 700; }
    a:hover { text-decoration: underline; }
    button, input { font: inherit; }
    .auth-card { width: min(100%, 510px); padding: 36px; border: 1px solid #e9eef5; border-radius: 18px; background: #fff; box-shadow: 0 16px 40px rgba(34, 52, 82, .07); }
    .auth-card.login { max-width: 430px; }
    .brand { display: flex; align-items: center; justify-content: center; gap: 7px; margin-bottom: 30px; color: var(--ink); font: 800 16px "Plus Jakarta Sans", sans-serif; }
    .brand:hover { text-decoration: none; }
    .brand-mark { display: grid; place-items: center; width: 27px; height: 27px; border-radius: 7px; background: var(--green); color: #fff; font-size: 21px; }
    h1 { max-width: 340px; margin: 0 auto 8px; font: 800 clamp(24px, 5vw, 30px)/1.2 "Plus Jakarta Sans", sans-serif; letter-spacing: -.04em; text-align: center; }
    .signup h1, .login h1 { margin-bottom: 28px; }
    .signup h1 span { color: var(--green); }
    .field { margin-bottom: 16px; }
    .field-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 6px; }
    label { color: var(--ink); font-size: 12px; font-weight: 800; }
    .password-hint { color: var(--muted); font-size: 11px; font-weight: 500; text-align: right; }
    .input-wrap { position: relative; }
    .field input { width: 100%; height: 45px; padding: 0 13px; border: 1px solid transparent; border-radius: 8px; outline: none; background: var(--field); color: var(--ink); font-size: 13px; }
    .field input::placeholder { color: #89969f; }
    .field input:focus { border-color: #62c69e; box-shadow: 0 0 0 3px #dff8e9; }
    .input-wrap:has(.toggle-password) input { padding-right: 85px; }
    .toggle-password { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); padding: 6px; border: 0; background: none; color: #426c5b; font-size: 11px; font-weight: 700; cursor: pointer; }
    .field-errors, .form-errors { margin: 6px 0 0; padding: 0; color: #aa3737; font-size: 12px; list-style: none; }
    .form-errors { margin-bottom: 15px; padding: 11px 13px; border-radius: 8px; background: #fff1f1; }
    .remember { display: flex; align-items: center; gap: 8px; margin: 3px 0 20px; color: #4d5c59; font-size: 12px; font-weight: 500; cursor: pointer; }
    .remember input { width: 16px; height: 16px; accent-color: var(--green); }
    .submit { width: 100%; min-height: 45px; margin-top: 4px; border: 0; border-radius: 8px; background: #006c4f; box-shadow: 0 5px 10px rgba(0, 93, 66, .14); color: #fff; font-size: 13px; font-weight: 800; cursor: pointer; }
    .submit:hover { background: #00583d; }
    .switch-page { margin: 24px 0 0; color: #485854; font-size: 13px; text-align: center; }
    @media (max-width: 480px) { .auth-card { padding: 28px 20px; } }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
  <script>
    document.querySelectorAll("[data-password-toggle]").forEach((button) => {
      button.addEventListener("click", () => {
        const input = document.getElementById(button.dataset.passwordToggle);
        const visible = input.type === "password";
        input.type = visible ? "text" : "password";
        button.textContent = visible ? "Sembunyikan" : "Tampilkan";
        button.setAttribute("aria-label", `${visible ? "Sembunyikan" : "Tampilkan"} kata sandi`);
      });
    });
  </script>
</body>
</html>
