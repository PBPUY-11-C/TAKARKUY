{% extends "accounts/settings_base.html" %}
{% block title %}Keamanan akun - Pengaturan profil{% endblock %}

<p class="settings-description">Masukkan kata sandi saat ini dan pilih kata sandi baru.</p>

</form>
{% endblock %}
