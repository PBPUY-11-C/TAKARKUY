<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAKARKUY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f7f9fe; color: #172235; font-family: "DM Sans", Arial, sans-serif; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }
    .site-header {
      min-height: 72px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      gap: 20px; padding: 12px clamp(24px, 4vw, 54px); background: #fff;
      border-bottom: 1px solid #edf0f5; box-shadow: 0 3px 14px rgba(28, 40, 62, .04);
    }
    .brand { display: inline-flex; align-items: center; gap: 10px; justify-self: start; color: #005b40; font: 700 17px "Plus Jakarta Sans", sans-serif; }
    .brand-mark { display: grid; place-items: center; width: 31px; height: 31px; color: #fff; background: #007452; border-radius: 9px; transform: rotate(-6deg); box-shadow: 0 4px 10px rgba(0, 116, 82, .17); }
    .brand-mark svg { width: 19px; transform: rotate(6deg); }
    .nav-links { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: clamp(8px, 1.5vw, 20px); white-space: nowrap; font-size: 14px; font-weight: 700; }
    .nav-links a:hover, .nav-links a:focus-visible { color: #007452; }
    .separator { color: #b5c6bf; }
    .header-actions { display: flex; align-items: center; justify-self: end; gap: 17px; white-space: nowrap; font-size: 14px; }
    .header-actions form { margin: 0; }
    .logout-button { min-height: 40px; padding: 0 18px; border: 0; border-radius: 8px; color: #fff; background: #007452; box-shadow: 0 5px 10px rgba(0, 93, 66, .17); cursor: pointer; font-weight: 700; }
    .logout-button:hover, .logout-button:focus-visible { background: #005b40; }
    @media (max-width: 900px) {
      .site-header { grid-template-columns: 1fr auto; }
      .nav-links { grid-column: 1 / -1; grid-row: 2; padding: 4px 0; }
      .header-actions { grid-column: 2; grid-row: 1; }
    }
    @media (max-width: 520px) {
      .site-header { padding-inline: 18px; gap: 12px; }
      .brand { font-size: 14px; }
      .header-actions { gap: 8px; font-size: 12px; }
      .logout-button { padding-inline: 12px; }
      .nav-links { font-size: 12px; gap: 7px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'modul5' %}" aria-label="TAKARKUY beranda">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 13c4-7 10-8 14-8-1 7-5 13-12 13-1 0-2-.2-3-.5 3.6-1.1 6.2-3.2 8.3-6.2-2.5 2.1-4.9 3.2-7.3 3.7Z" fill="currentColor"/><path d="M5 18c2-3 4.6-5.4 8-7" stroke="#007452" stroke-width="1.6" stroke-linecap="round"/></svg></span>
      <span>TAKARKUY</span>
    </a>
    <nav class="nav-links" aria-label="Navigasi modul">
      <a href="{% url 'modul1' %}">Budget Meal Planner</a>
      <span class="separator" aria-hidden="true">|</span>
      <a href="{% url 'modul2' %}">Smart Pantry</a>
      <span class="separator" aria-hidden="true">|</span>
      <a href="{% url 'modul4' %}">Recipe Book</a>
    </nav>
    <div class="header-actions">
      <a href="{% url 'modul3' %}" aria-label="Profil dan preferensi">Hai, {{ user.first_name|default:user.username }}!</a>
      <form action="{% url 'logout' %}" method="post">
        {% csrf_token %}
        <button class="logout-button" type="submit">Keluar</button>
      </form>
    </div>
  </header>
  <main></main>
</body>
</html>
