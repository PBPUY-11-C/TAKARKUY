{% extends "base.html" %}
{% block content %}
<main class="container">
  <h1>{{ judul }}</h1>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div>
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}
      </div>
    {% endfor %}
    <button type="submit">Simpan</button>
    <a href="{% if recipe %}{% url 'modul5-recipe-detail' recipe.pk %}{% else %}{% url 'modul5' %}{% endif %}">Batal</a>
  </form>
</main>
{% endblock %}
