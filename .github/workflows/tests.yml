name: Tests (PostgreSQL)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PRODUCTION: "false"
      TEST_PG_USER: postgres
      TEST_PG_PASSWORD: test-only-password
      TEST_PG_PORT: "55432"
      TEST_PG_DATABASE: test_takarkuy_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - run: pip install -r requirements.txt
      - run: python data/validate_catalog.py && python data/validate_candidates.py && python data/validate_docs.py
      - run: python manage.py makemigrations --check --dry-run --settings=config.test_postgres
      - run: python manage.py test --settings=config.test_postgres --noinput
      - run: node --test apps/*/tests_js/*.mjs
